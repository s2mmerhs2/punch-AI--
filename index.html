<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 엉덩이 때리기 🍑</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
*:focus, *:focus-visible { outline: none; }

:root {
  --pink: #ff6b9d;
  --purple: #c77dff;
  --bg: #fff0f8;
}

html, body {
  height: 100%;
  font-family: 'Jua', sans-serif;
  background: var(--bg);
  overflow: hidden; /* no scroll on mobile */
  cursor: none;
}

/* ─── LAYOUT: full-height flex column ─── */
.app {
  height: 100dvh; /* dynamic viewport height - handles mobile browser chrome */
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}

/* ─── CUSTOM CURSOR (desktop only) ─── */
#cursor {
  position: fixed;
  pointer-events: none;
  z-index: 99999;
  font-size: 2.4rem;
  transform: translate(-28%, -80%);
  line-height: 1;
  filter: drop-shadow(1px 2px 3px rgba(0,0,0,0.2));
  transition: transform 0.06s;
}
#cursor.slapping {
  transform: translate(-28%, -50%) rotate(28deg) scale(1.4);
}

/* ─── HEADER ─── */
.header {
  width: 100%;
  text-align: center;
  padding: 18px 16px 10px;
  flex-shrink: 0;
}
.header h1 {
  font-size: 1.7rem;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
}

/* ─── TAB BAR ─── */
.tab-bar {
  display: flex;
  gap: 6px;
  background: #fff;
  border-radius: 999px;
  padding: 5px;
  box-shadow: 0 3px 16px rgba(200,120,255,0.18);
  margin: 0 16px 12px;
  flex-shrink: 0;
  width: calc(100% - 32px);
  max-width: 400px;
}
.tab {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 4px;
  border-radius: 999px;
  cursor: pointer;
  font-family: 'Jua', sans-serif;
  font-size: 0.95rem;
  color: #bbb;
  border: none;
  background: transparent;
  transition: background 0.2s, color 0.2s;
  white-space: nowrap;
  user-select: none;
}
.tab img {
  width: 22px;
  height: 26px;
  object-fit: cover;
  border-radius: 4px;
  pointer-events: none;
}
.tab.active-gpt    { background: #10a37f; color: #fff; }
.tab.active-gemini { background: #4285f4; color: #fff; }
.tab.active-claude { background: #a855f7; color: #fff; }

/* ─── SLAP IMAGE ─── */
.slap-zone {
  position: relative;
  flex: 1;          /* takes all remaining vertical space */
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  min-height: 0;    /* allow flex shrink */
  overflow: hidden;
}
.slap-zone img {
  /* fill the zone fully, cropped */
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
  transition: transform 0.07s ease;
}
.slap-zone.hit img {
  transform: scale(0.97) rotate(-1.5deg);
}
.hit-glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 35%, rgba(255,70,110,0.38) 0%, transparent 60%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.05s;
}
.slap-zone.hit .hit-glow { opacity: 1; }

.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,107,157,0.55);
  width: 70px; height: 70px;
  margin-left: -35px; margin-top: -35px;
  pointer-events: none;
  animation: rippleOut 0.5s ease-out forwards;
}
@keyframes rippleOut {
  from { transform: scale(0.3); opacity: 1; }
  to   { transform: scale(3); opacity: 0; }
}

/* ─── BOTTOM PANEL ─── */
.bottom {
  width: 100%;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 16px 20px;
  background: var(--bg);
  gap: 4px;
}

.score-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.score-num {
  font-size: 4rem;
  line-height: 1;
  color: var(--pink);
  transition: transform 0.12s cubic-bezier(0.3,0,0.5,2.2);
}
.score-num.pop { transform: scale(1.5); }
.score-unit {
  font-size: 1rem;
  color: #ccc;
}

.reaction {
  font-size: 1.4rem;
  color: var(--pink);
  min-height: 2rem;
  text-align: center;
}
.reaction.animate {
  animation: fadeInUp 0.18s ease-out;
}
@keyframes fadeInUp {
  from { opacity:0; transform: translateY(8px); }
  to   { opacity:1; transform: translateY(0); }
}

.btn-reset {
  margin-top: 6px;
  padding: 9px 28px;
  border-radius: 50px;
  border: none;
  font-family: 'Jua', sans-serif;
  font-size: 0.95rem;
  color: #fff;
  cursor: pointer;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  box-shadow: 0 3px 14px rgba(200,120,255,0.28);
  transition: transform 0.12s;
}
.btn-reset:active { transform: scale(0.93); }

/* ─── PARTICLES ─── */
.particle {
  position: fixed;
  pointer-events: none;
  font-size: 1.6rem;
  z-index: 9999;
  animation: floatUp 0.9s ease-out forwards;
}
@keyframes floatUp {
  0%   { transform: translate(0,0) scale(0.7) rotate(0deg); opacity:1; }
  100% { transform: translate(var(--dx),-140px) scale(1.3) rotate(var(--dr)); opacity:0; }
}

#flash {
  position: fixed; inset: 0;
  pointer-events: none;
  background: rgba(255,90,140,0.13);
  opacity: 0;
  z-index: 9998;
}
#flash.on { opacity: 1; }

/* desktop cursor hide on mobile */
@media (hover: none) {
  html, body { cursor: auto; }
  #cursor { display: none; }
}
</style>
</head>
<body>
<div id="flash"></div>
<div id="cursor">🖐️</div>

<div class="app">

  <!-- 헤더 -->
  <div class="header">
    <h1>🍑 AI 엉덩이 때리기</h1>
  </div>

  <!-- 탭 -->
  <div class="tab-bar">
    <button class="tab active-gpt" id="tab-gpt" onclick="selectAI('gpt')">
      <img src="gpt.png" alt=""> ChatGPT
    </button>
    <button class="tab" id="tab-gemini" onclick="selectAI('gemini')">
      <img src="gemini.png" alt=""> Gemini
    </button>
    <button class="tab" id="tab-claude" onclick="selectAI('claude')">
      <img src="claude.png" alt=""> Claude
    </button>
  </div>

  <!-- 이미지 (나머지 공간 전부) -->
  <div class="slap-zone" id="slapZone">
    <img id="slapImg" src="gpt.png" alt="">
    <div class="hit-glow"></div>
  </div>

  <!-- 점수 + 반응 + 초기화 -->
  <div class="bottom">
    <div class="score-row">
      <div class="score-num" id="scoreNum">0</div>
      <div class="score-unit">대 맞음</div>
    </div>
    <div class="reaction" id="reaction">탭해서 때려보세요! 🖐️</div>
    <button class="btn-reset" onclick="resetScore()">🔄 초기화</button>
  </div>

</div>

<script>
/* ── Cursor (desktop) ────────────────── */
const cursorEl = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursorEl.style.left = e.clientX + 'px';
  cursorEl.style.top  = e.clientY + 'px';
});

/* ── Data ───────────────────────────── */
const AI_INFO = {
  gpt:    { img: 'gpt.png',    color: '#10a37f' },
  gemini: { img: 'gemini.png', color: '#4285f4' },
  claude: { img: 'claude.png', color: '#a855f7' },
};
const PARTICLES = ['💥','✨','🌟','💫','🩷','🌸','⭐','🔥','🫧','💖'];
const REACTIONS = ['아얏! 🥺','으윽...','살려줘요!','왜 때려요 😭','그만해줘요 😤','아파요!!','꺄악!','헉!','윽..','으아악!','하지마요!','엉엉 😭'];

let currentAI = 'gpt';
let scores = { gpt: 0, gemini: 0, claude: 0 };

Object.keys(scores).forEach(ai => {
  const s = localStorage.getItem('slap_' + ai);
  if (s) scores[ai] = parseInt(s);
});

document.getElementById('scoreNum').textContent = scores.gpt;
document.getElementById('scoreNum').style.color = AI_INFO.gpt.color;

/* ── Select ─────────────────────────── */
function selectAI(ai) {
  currentAI = ai;
  Object.keys(AI_INFO).forEach(a => {
    document.getElementById('tab-' + a).className = a === ai ? 'tab active-' + a : 'tab';
  });
  document.getElementById('slapImg').src = AI_INFO[ai].img;
  const num = document.getElementById('scoreNum');
  num.style.color = AI_INFO[ai].color;
  num.textContent = scores[ai];
  const react = document.getElementById('reaction');
  react.textContent = '탭해서 때려보세요! 🖐️';
  react.style.color = AI_INFO[ai].color;
}

/* ── Reset ──────────────────────────── */
function resetScore() {
  if (!confirm('정말 초기화할까요? 🥺')) return;
  scores[currentAI] = 0;
  localStorage.removeItem('slap_' + currentAI);
  document.getElementById('scoreNum').textContent = '0';
  document.getElementById('reaction').textContent = '탭해서 때려보세요! 🖐️';
}

/* ── Slap ───────────────────────────── */
const slapZone = document.getElementById('slapZone');
let hitTimer = null, popTimer = null, cursorTimer = null;

function doSlap(clientX, clientY) {
  scores[currentAI]++;
  localStorage.setItem('slap_' + currentAI, scores[currentAI]);

  const numEl = document.getElementById('scoreNum');
  numEl.textContent = scores[currentAI];
  numEl.classList.remove('pop');
  void numEl.offsetWidth;
  numEl.classList.add('pop');
  clearTimeout(popTimer);
  popTimer = setTimeout(() => numEl.classList.remove('pop'), 220);

  slapZone.classList.add('hit');
  clearTimeout(hitTimer);
  hitTimer = setTimeout(() => slapZone.classList.remove('hit'), 160);

  cursorEl.classList.add('slapping');
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => cursorEl.classList.remove('slapping'), 210);

  const rect = slapZone.getBoundingClientRect();
  const rip = document.createElement('div');
  rip.className = 'ripple';
  rip.style.left = (clientX - rect.left) + 'px';
  rip.style.top  = (clientY - rect.top)  + 'px';
  slapZone.appendChild(rip);
  setTimeout(() => rip.remove(), 520);

  spawnParticles(clientX, clientY);

  const react = document.getElementById('reaction');
  react.classList.remove('animate');
  void react.offsetWidth;
  react.classList.add('animate');
  react.textContent = REACTIONS[Math.floor(Math.random() * REACTIONS.length)];

  if (scores[currentAI] % 10 === 0) {
    setTimeout(() => {
      document.getElementById('reaction').textContent = `🎉 ${scores[currentAI]}대 달성!!`;
    }, 280);
  }

  document.getElementById('flash').classList.add('on');
  setTimeout(() => document.getElementById('flash').classList.remove('on'), 65);
}

slapZone.addEventListener('click', e => { e.currentTarget.blur(); doSlap(e.clientX, e.clientY); });
slapZone.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  doSlap(t.clientX, t.clientY);
}, { passive: false });

/* ── Particles ──────────────────────── */
function spawnParticles(x, y) {
  const n = 5 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    el.textContent = PARTICLES[Math.floor(Math.random() * PARTICLES.length)];
    const dx = (Math.random() - 0.5) * 160;
    const dr = (Math.random() - 0.5) * 80 + 'deg';
    el.style.setProperty('--dx', dx + 'px');
    el.style.setProperty('--dr', dr);
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.style.animationDelay = Math.random() * 0.08 + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1050);
  }
}
</script>
</body>
</html>
